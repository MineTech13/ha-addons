name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.list.outputs.addons }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "addons=$(for f in */config.yaml; do dirname "$f"; done | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  addon-linter:
    needs: find
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.find.outputs.addons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck */run.sh scripts/*.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3008,DL3006,DL3007,DL3002
