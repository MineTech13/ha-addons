name: Kobra Vision (AI failure detection)
version: "3.17.0-0"
slug: kobra_vision
stage: experimental
description: "EXPERIMENTAL: AI print-failure detection (spaghetti) for the ACE Lane Bridge, using Obico's failure model on the CPU. Community project xNoVoSx/kobra-spoolman."
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  7917/tcp: null
ports_description:
  7917/tcp: "Optional direct port, only needed if the bridge does not run as a Home Assistant add-on. Disabled by default."
options:
  THREADS: 2
  UNLOAD_AFTER_S: 600
  LOG_LEVEL: "INFO"
schema:
  THREADS: int(1,16)
  UNLOAD_AFTER_S: int(60,86400)
  VISION_TOKEN: password?
  LOG_LEVEL: list(DEBUG|INFO|WARNING|ERROR)
privileged: []
