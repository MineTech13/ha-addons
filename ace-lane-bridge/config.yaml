name: ACE Lane Bridge (Spoolman)
version: "2.21.1-3"
slug: ace_lane_bridge
stage: experimental
description: "EXPERIMENTAL: Books filament usage per ACE slot into Spoolman via Moonraker (Rinkhals). Community project xNoVoSx/kobra-spoolman."
arch:
  - amd64
  - aarch64
startup: services
init: false
map:
  - app_config:rw
ingress: true
ingress_port: 7913
panel_icon: mdi:printer-3d-nozzle
panel_title: ACE Lanes
ports:
  7913/tcp: 7913
ports_description:
  7913/tcp: "Direct access port (web UI, Android app, OrcaSlicer plugin). Clear the host port to disable."
options:
  MOONRAKER_URL: "http://192.168.1.50:7125"
  SPOOLMAN_URL: "http://192.168.1.10:7912"
  DRY_RUN: true
  RUN_SPOOLMAN_SETUP: false
  INGRESS_CAMERA_SNAPSHOTS: true
  LOG_LEVEL: "INFO"
schema:
  MOONRAKER_URL: str
  SPOOLMAN_URL: str
  MOONRAKER_API_KEY: str?
  SPOOLMAN_PUBLIC_URL: str?
  PRINTER_UI_URL: str?
  DRY_RUN: bool
  RUN_SPOOLMAN_SETUP: bool
  INGRESS_CAMERA_SNAPSHOTS: bool
  BRIDGE_PUBLIC_URL: str?
  LOG_LEVEL: list(DEBUG|INFO|WARNING|ERROR)
privileged: []
